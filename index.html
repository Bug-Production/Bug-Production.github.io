<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BugProduction</title>
<meta name="description" content="BugProduction — resmi web sitesi yakında.">
<meta property="og:title" content="BugProduction">
<meta property="og:description" content="BugProduction — resmi web sitesi yakında.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128030;</text></svg>">
<style>
  :root {
    --bg: #0b0d12;
    --bg-glow-1: #1b2a4a;
    --bg-glow-2: #2a1b3d;
    --fg: #e9edf5;
    --muted: #8a93a6;
    --accent: #5eead4;
    --line: rgba(233, 237, 245, .1);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: -40%;
    background:
      radial-gradient(45% 45% at 25% 30%, var(--bg-glow-1) 0%, transparent 60%),
      radial-gradient(40% 40% at 75% 70%, var(--bg-glow-2) 0%, transparent 60%);
    filter: blur(20px);
    animation: drift 24s ease-in-out infinite alternate;
    z-index: 0;
  }

  @keyframes drift {
    from { transform: translate3d(-2%, -1%, 0) scale(1); }
    to   { transform: translate3d(2%, 1%, 0) scale(1.08); }
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 640px;
    text-align: center;
  }

  .tag {
    display: inline-block;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    margin-bottom: 28px;
  }

  h1 {
    margin: 0;
    font-size: clamp(38px, 9vw, 76px);
    font-weight: 700;
    letter-spacing: -.03em;
    line-height: 1.05;
  }

  h1 .bug { color: var(--accent); }

  p {
    margin: 20px auto 0;
    max-width: 42ch;
    font-size: clamp(15px, 2.4vw, 18px);
    line-height: 1.65;
    color: var(--muted);
  }

  .links {
    margin-top: 36px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .links a {
    color: var(--fg);
    text-decoration: none;
    font-size: 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 18px;
    transition: border-color .2s ease, background-color .2s ease, transform .2s ease;
  }

  .links a:hover {
    border-color: var(--accent);
    background: rgba(94, 234, 212, .08);
    transform: translateY(-1px);
  }

  footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 20px;
    z-index: 1;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    body::before { animation: none; }
  }
</style>
</head>
<body>
  <main>
    <span class="tag">yapım aşamasında</span>
    <h1><span class="bug">Bug</span>Production</h1>
    <p>Resmi web sitemiz üzerinde çalışıyoruz. Bu arada projelerimizi GitHub üzerinden takip edebilirsiniz.</p>
    <div class="links">
      <a href="https://github.com/Bug-Production">GitHub</a>
    </div>
  </main>
  <footer>&copy; <span id="y">2026</span> BugProduction</footer>
  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
